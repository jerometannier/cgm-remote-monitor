name: Build and deploy Nightscout to Azure Web App - nightscout-jerome

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create a deployment ZIP WITHOUT node_modules and WITHOUT node_modules.tar.gz
      # This forces Azure/Oryx to do a clean dependency install on deploy.
      - name: Create deployment package
        run: |
          zip -r app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "node_modules.tar.gz" \
            -x "**/node_modules/*" \
            -x "**/node_modules.tar.gz"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BB4D477233A44CE78C92592A020A1E82 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6193F752D0EA4B16AD7187DD1F6EE39A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_683E3733D6634E6DA660072342150DEF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: nightscout-jerome
          slot-name: Production
          package: app.zip
